<section id="projects" class="projects section">
  <div class="container">
    <div class="projects-head">
      <div>
        <span class="section-tag">My Projects</span>
        <h2 class="section-title">Featured <span class="gradient-text">Projects</span></h2>
        <p class="projects-sub">
          Here are some of the key projects I've worked on during my professional journey.
        </p>
      </div>

      <div class="head-actions">
        <div class="slider-nav">
          <button class="nav-arrow" (click)="scrollSlider('prev')" aria-label="Previous projects">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="nav-arrow" (click)="scrollSlider('next')" aria-label="Next projects">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
        <button class="view-all" (click)="openAll()">
          View All Projects
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </div>
    </div>

    <div class="slider-track" #track>
      <article class="project-card" *ngFor="let p of projects" [class.featured]="p.featured">
        <span class="featured-badge" *ngIf="p.featured">★ Featured</span>
        <div class="project-thumb">
          <div class="thumb-window">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="thumb-lines">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="project-body">
          <h3>{{ p.title }}</h3>
          <p class="project-meta" *ngIf="p.company">{{ p.company }}<span *ngIf="p.period"> · {{ p.period }}</span></p>
          <p class="project-desc">{{ p.description }}</p>
          <div class="tags">
            <span class="tag" *ngFor="let t of p.tags">{{ t }}</span>
          </div>
          <button class="details-link" (click)="openOne(p)">
            View Details
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </div>
      </article>
    </div>
  </div>
</section>

<app-all-projects
  *ngIf="showOverlay"
  [projects]="overlayProjects"
  [mode]="overlayMode"
  (close)="closeOverlay()"
></app-all-projects>
